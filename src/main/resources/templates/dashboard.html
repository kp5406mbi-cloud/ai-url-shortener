<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>AI URL Shortener Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Header -->

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">
                AI URL Shortener Dashboard
            </h2>

        </div>

        <div class="card-body">

            <form
                    class="row g-3"
                    th:action="@{/shorten}"
                    method="post">

                <div class="col-md-6">

                    <label class="form-label">

                        Original URL

                    </label>

                    <input
                            name="originalUrl"
                            type="text"
                            class="form-control"
                            placeholder="https://example.com"
                            required>

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Custom Alias

                    </label>

                    <input
                            name="customAlias"
                            type="text"
                            class="form-control"
                            placeholder="my-link">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Expiry Days

                    </label>

                    <input
                            name="expiryDays"
                            type="number"
                            class="form-control"
                            placeholder="7">

                </div>

                <div class="col-12">

                    <button
                            class="btn btn-success"
                            type="submit">

                        Shorten URL

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Dashboard Cards -->

    <div class="row mt-4">

        <div class="col-md-4">

            <div class="card shadow-sm text-center">

                <div class="card-body">

                    <h5>Total URLs</h5>

                    <h2 th:text="${urls.size()}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm text-center">

                <div class="card-body">

                    <h5>Total Clicks</h5>

                    <h2 th:text="${totalClicks}">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow-sm text-center">

                <div class="card-body">

                    <h5>Active URLs</h5>

                    <h2 th:text="${urls.size()}">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <!-- URL Table -->

    <div class="card mt-4 shadow">

        <div class="card-header">

            <h4 class="mb-0">
                My URLs
            </h4>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>Short URL</th>
                    <th>Clicks</th>
                    <th>Created</th>
                    <th width="420">Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="url : ${urls}">

                    <td th:text="${url.shortCode}">
                        abc123
                    </td>

                    <td th:text="${url.clickCount}">
                        0
                    </td>

                    <td th:text="${url.createdAt}">
                        date
                    </td>

                    <td>

                        <!-- Open -->

                        <a
                                th:href="@{'/' + ${url.shortCode}}"
                                target="_blank"
                                class="btn btn-success btn-sm">

                            Open

                        </a>

                        <!-- Copy -->

                        <button
                                type="button"
                                class="btn btn-primary btn-sm"
                                th:data-url="${'http://localhost:8080/' + url.shortCode}"
                                onclick="copyUrl(this)">

                            Copy

                        </button>

                        <!-- QR -->

                        <button
                                type="button"
                                class="btn btn-dark btn-sm"
                                th:data-code="${url.shortCode}"
                                onclick="showQR(this)">

                            QR

                        </button>

                        <!-- Stats -->

                        <a
                                th:href="@{'/stats/' + ${url.shortCode}}"
                                class="btn btn-info btn-sm">

                            Stats

                        </a>

                        <!-- Delete -->

                        <form
                                th:action="@{'/delete/' + ${url.shortCode}}"
                                method="post"
                                style="display:inline;">

                            <button
                                    type="submit"
                                    class="btn btn-danger btn-sm">

                                Delete

                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- QR Code Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">QR Code</h5>

                    <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body text-center">

                    <img
                            id="qrImage"
                            class="img-fluid"
                            style="max-width:300px;">

                </div>

                <div class="modal-footer">

                    <a
                            id="downloadQR"
                            class="btn btn-success"
                            download="qr.png">

                        Download QR

                    </a>

                    <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Close

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script>

        function copyUrl(button) {

            navigator.clipboard.writeText(button.dataset.url);

            alert("URL copied!");
        }

        function showQR(button) {

            const code = button.dataset.code;

            const qrUrl = "/api/urls/" + code + "/qr";

            document.getElementById("qrImage").src = qrUrl;

            document.getElementById("downloadQR").href = qrUrl;

            const modal = new bootstrap.Modal(
                document.getElementById("qrModal")
            );

            modal.show();
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
